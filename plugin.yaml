name: follow-through
version: 1.0.1
description: "Nudges concrete work promises through one native llm_execution middleware and the follow_through tool. At most one issued nudge per user turn, including failed tool calls; preserves approval and consent requirements. Text matching does not know running state. Fail-open; no independent model request, file/network/subprocess operations or durable state. The existing agent loop may continue. Generic logs omit draft quotations. FOLLOW_THROUGH_OFF=1 or FOLLOW_THROUGH_MAX_NUDGES=0 disables nudges."
author: "Giulio Di Stefano (agenziamaia)"
license: MIT
provides_tools:
  - follow_through
provides_middleware:
  - llm_execution
requires_hermes: ">=0.21.6"
